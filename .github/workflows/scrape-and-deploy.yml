name: Scrape & Deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --prefer-offline --no-audit --no-fund

      # Reuse Next's compiler/webpack cache across runs so the build does less
      # work each time (the pages still re-render with fresh wait data).
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*', 'tailwind.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-

      - name: Ensure data directory
        run: mkdir -p data

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: |
            data/aewaittime.db
            data/aewaittime.db-wal
            data/aewaittime.db-shm
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: Run scrapers
        run: npx tsx scripts/scrape.ts

      - name: Save database
        uses: actions/cache/save@v4
        with:
          path: |
            data/aewaittime.db
            data/aewaittime.db-wal
            data/aewaittime.db-shm
          key: db-${{ github.run_id }}

      - name: Build static site
        run: npm run build

      - name: Setup SSH
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${CPANEL_SSH_PORT:-2239}"

          mkdir -p ~/.ssh
          printf '%s
' "$CPANEL_SSH_KEY" | tr -d '' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" true

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_TARGET_DIR: ${{ secrets.CPANEL_TARGET_DIR }}
        run: |
          set -euo pipefail
          SSH_PORT="${CPANEL_SSH_PORT:-2239}"
          TARGET="${CPANEL_TARGET_DIR}"

          # The site is ~1,250 tiny files; scp uploaded them one at a time, so
          # ~1,250 sequential SFTP round-trips dominated the deploy. lftp mirror
          # reuses one connection and transfers 10 files in parallel, cutting the
          # upload from minutes to seconds. No --delete, so (like scp) it only
          # adds/overwrites and never removes — retired pages stay tombstoned via
          # .htaccess. fail-exit makes a partial upload fail the job loudly
          # instead of half-deploying to the live site.
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 2;
            set net:timeout 20;
            set mirror:parallel-transfer-count 10;
            set sftp:auto-confirm yes;
            set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p $SSH_PORT';
            open -u '$CPANEL_USER,' 'sftp://$CPANEL_HOST';
            mirror -R out/ '$TARGET/';
            bye
          "